[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordfamily"
version = "0.1.0"
description = "英语词族：卡片、单词查询与补全练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "english", "phonics", "word-family", "worksheet", "printable"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
wordfamily = "wordfamily.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/wordfamily"
Source = "https://github.com/eastyou/wordfamily"

[tool.setuptools]
packages = ["wordfamily"]
